name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-15-intel, python: '3.14'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install native Tk import support on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Strict tests, native loopback HTTP/Git and maintained source maps
        shell: bash
        run: bash scripts/validate.sh
      - name: Summary only, no artifact or cache uploads
        if: always()
        shell: bash
        run: printf '%s\n' 'Counts, branch-inclusive coverage and measured benchmark are in this job log. No private evidence, artifacts or Actions caches uploaded.' >> "$GITHUB_STEP_SUMMARY"
  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python scripts/bootstrap.py helm-linux
      - run: python scripts/manifest_check.py
  cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Explicit hash-verified tools, no shell installers
        run: |
          python scripts/bootstrap.py helm-linux
          python scripts/bootstrap.py flux-linux
          python scripts/bootstrap.py k3d-linux
          python scripts/bootstrap.py kubectl-linux
          python scripts/scanners.py trivy
      - name: Real Git promotion, drift, RBAC, network enforcement, admission and Helm rollback
        run: python scripts/cluster_drill.py --output out/ci-drill --ack-disposable-docker
      - name: Actual built workload image HIGH/CRITICAL vulnerability gate
        run: .tools/trivy image --severity HIGH,CRITICAL --exit-code 1 --scanners vuln gitops-sre:lab
      - name: Synthetic aggregate results in summary only
        run: |
          printf '%s\n' 'Ten real disposable-cluster cases passed; failed Helm revision retained, rollback and later Git recovery verified. Workload image scanned. No production deployment, artifact upload or Actions cache.' >> "$GITHUB_STEP_SUMMARY"
          python -m lab report out/ci-drill/report/drill.json --output out/validated-report
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Complete runtime and validation advisory audits
        run: |
          python -m pip_audit -r requirements.lock --disable-pip --no-deps
          python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps
      - name: Official hash-verified scanners
        run: |
          python scripts/scanners.py gitleaks
          python scripts/scanners.py actionlint
      - name: Full history secrets and native workflow/shell checks
        run: |
          .tools/gitleaks git . --redact --no-banner
          .tools/actionlint
          shellcheck scripts/validate.sh

  portable-windows:
    name: Windows / actual offline native workbench
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
      - run: python -m pip install --require-hashes -r requirements-dev.lock -r requirements-native.lock
      - run: python -m pip check
      - run: python -m pip_audit -r requirements-native.lock --disable-pip --no-deps
      - name: Build actual patched runtime and original notices
        run: python scripts/build_native.py
      - name: Use compiled app controls, independent oracles, export and two-process reopen
        run: python scripts/test_native_app.py
