apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: sre, namespace: platform-lab}
spec:
  interval: 10s
  timeout: 40s
  serviceAccountName: delivery
  releaseName: sre
  chart:
    spec:
      chart: ./chart
      reconcileStrategy: Revision
      sourceRef: {kind: GitRepository, name: platform}
      interval: 10s
  driftDetection: {mode: enabled}
  install:
    remediation: {retries: 1}
  upgrade:
    remediation: {retries: 0, remediateLastFailure: true, strategy: rollback}
  values:
    replicas: 1
    image: gitops-sre:lab
    readinessPath: /health
    revision: baseline
