apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: {{ .Release.Namespace }}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: reviewer-ingress, namespace: {{ .Release.Namespace }}}
spec:
  podSelector:
    matchLabels: {app: sre}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {gitops.platform/client: allowed}
          podSelector:
            matchLabels: {role: reviewer}
      ports: [{protocol: TCP, port: 8080}]
