apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: platform, namespace: platform-lab}
spec:
  interval: 10s
  url: https://github.com/JasonStys/gitops-platform-lab
  ref: {branch: main}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: platform, namespace: platform-lab}
spec:
  interval: 10s
  timeout: 60s
  prune: true
  path: ./gitops
  serviceAccountName: reconciler
  sourceRef: {kind: GitRepository, name: platform}
